name: Generate Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"   # her gün bir kez günceller
  workflow_dispatch:       # elle çalıştırmak için

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#24292f&color_dots=#ebedf0,#ffd3c7,#ff9f85,#f97352,#F54A2A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFFFFF&color_dots=#161b22,#5c1f12,#9e3420,#d9452a,#F54A2A

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
